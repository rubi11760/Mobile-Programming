<!DOCTYPE html>
<html>
<head>
  <title>Example</title>
</head>
<body>

  <div id="result">The difference is: </div>
  <button onclick="displaydifference()">Display Sum</button>

  <script>
    function displaydifference() {
      var a = 8;
      var b = 5;
      var c = a - b;
      document.getElementById("result").innerHTML = "The difference is: " + c;
      console.log('clicked');
    }
  </script>

</body>
</html>
